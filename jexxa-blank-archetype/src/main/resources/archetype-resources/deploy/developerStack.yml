version: "3.9"

services:
  ActiveMQ:
    image: apache/artemis:latest
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
      AMQ_EXTRA_ARGS: --relax-jolokia

  Postgres:
    image: postgres:latest
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin


  S3Storage:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    ports:
      - "8100:9000"   # S3 API
      - "8101:9001"   # Web UI
    environment:
      MINIO_ROOT_USER: minioadmin      # Admin Access Key
      MINIO_ROOT_PASSWORD: minioadmin  # Admin Secret Key
    volumes:
      - s3-data:/data


  SwaggerUI:
    image: swaggerapi/swagger-ui:latest
    restart: always
    ports:
      - '8080:8080'

volumes:
  postgres-data:
  s3-data: