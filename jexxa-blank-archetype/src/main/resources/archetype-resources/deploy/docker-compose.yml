#set($hash = '#')
version: "3.7"

services:

  ${projectName}:
    image: ${containerRegistry}/${artifactId.toLowerCase()}/${artifactId.toLowerCase()}:latest
    stop_grace_period: 60s
    ports:
      - "7508:7500" # Optional: Adjust HTTP Port "<free HTTP-Port>:7500"

    healthcheck:
      test: ["CMD-SHELL", "wget -nv -t1 --spider 'http://localhost:7500/BoundedContext/isRunning/'"]
      interval: 10s
      timeout: 10s
      retries: 3

    deploy:   # configure zero downtime deployment
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback

      rollback_config:
        parallelism: 1
        order: start-first

      restart_policy:
        condition: on-failure

  ### Infrastructure ###

  ActiveMQ:
    image: apache/artemis:latest
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
      AMQ_EXTRA_ARGS: --relax-jolokia

  Postgres:
    image: postgres:18
    user: postgres
    stop_grace_period: 120s
    volumes:
      - postgres-data:/var/lib/postgresql

    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
